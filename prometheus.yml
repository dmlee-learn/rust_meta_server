global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Phase 32: SLO alert rules
rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  # 알림 수신 (외부 Alertmanager) — 비활성화
  # alertmanagers:
