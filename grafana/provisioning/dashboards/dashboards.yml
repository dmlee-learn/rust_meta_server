apiVersion: 1
providers:
  - name: 'meta_server'
    orgId: 1
    folder: ''
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards

  # Phase 32: SLO dashboard (monitoring/grafana-dashboards)
  - name: 'meta_server_slo'
    orgId: 1
    folder: 'SLO'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
